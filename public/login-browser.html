<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TestHub · 网页登录</title><link rel="stylesheet" href="/style.css"></head><body class="remote-login"><main><h1>项目网页登录</h1><p>点击“打开登录页面”后，在下方画面中输入账号、密码并手动完成验证码。进入业务页面后保存。会话最多保留 15 分钟。</p><div class="actions"><button id="start" class="primary">打开登录页面</button><button id="reload" disabled>刷新页面</button><button id="cancel" disabled>关闭会话</button></div><p id="status" role="status">准备就绪</p><label>当前页面<select id="tabs" disabled></select></label><p id="url"></p><div class="remote-screen"><img id="screen" alt="远程登录页面，点击后可键盘输入" tabindex="0" draggable="false" hidden></div><div class="remote-tools"><label>中文或粘贴输入（先点击远程输入框）<input id="text" type="password" autocomplete="off" placeholder="输入内容不会保存到平台日志"></label><button id="insert" disabled>输入到选中位置</button><button id="tab" disabled>Tab 下一项</button><button id="enter" disabled>Enter 确认</button></div><label><input type="checkbox" id="confirmed">我已完成登录，并已进入当前项目的业务页面</label><button id="save" class="primary" disabled>保存登录态到项目</button><p>保存的是浏览器会话数据，不会把账号密码发送给模型。验证码仍由你操作；部分验证码可能不支持此远程交互方式。</p></main><script type="module" src="/login-browser.js"></script></body></html>
