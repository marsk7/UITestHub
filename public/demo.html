<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>人员管理 · 测试示例</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="demo">
    <main><span class="eyebrow">TESTHUB / DEMO</span>
        <h1>人员管理</h1>
        <p>仅使用虚构测试数据，不连接任何业务系统。</p>
        <form id="query"><label>姓名<input name="name" id="name" placeholder="请输入姓名"></label><button class="primary"
                type="submit">查询</button><button type="reset">重置</button></form>
        <table>
            <thead>
                <tr>
                    <th>工号</th>
                    <th>姓名</th>
                    <th>部门</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <p id="empty" hidden>暂无符合条件的人员</p>
    </main>
    <script src="/app.js" type="module"></script>
</body>

</html>
