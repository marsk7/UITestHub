services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-testhub}
      MYSQL_USER: ${DB_USER:-testhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - testhub-mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    build: .
    shm_size: 1gb
    image: testhub-ui:1.2-mysql
    init: true
    env_file: .env
    environment: &app-env
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-testhub}
      DB_USER: ${DB_USER:-testhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ""
      PORT: 8080
      DATA_DIR: /app/data
      DEMO_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - testhub-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
  worker:
    image: testhub-ui:1.2-mysql
    init: true
    env_file: .env
    environment:
      <<: *app-env
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    command: ["node", "src/worker.mjs"]
    volumes:
      - testhub-data:/app/data
    shm_size: 1gb
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  testhub-data:
  testhub-mysql:
